      uses: actions/upload-artifact@v4
      with:
        name: upstream-reuse-win-arm64-${{ github.job }}-attempt-${{ github.run_attempt }}
        path: |
          C:\c\chromix\upstream-reuse\baseline.json
          C:\c\chromix\upstream-reuse\result.json
          C:\c\chromix\upstream-cache-preparation.json
        if-no-files-found: ignore
        retention-days: 3
    - name: Ensure build tree snapshot
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.upload_parts != 'true' && steps.stage.outputs.finished != 'true' }}
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path C:\c\chromix | Out-Null
        . build\windows\ci-parts.ps1 -Root C:\c -PartsDir C:\parts -Mode Synced
    - name: Upload tree part 1
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.finished != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: win-arm64-tree-s16-attempt-${{ github.run_attempt }}-part1
        path: C:\parts\p1\*
        if-no-files-found: warn
        retention-days: 3
        compression-level: 0
    - name: Upload tree part 2
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.finished != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: win-arm64-tree-s16-attempt-${{ github.run_attempt }}-part2
        path: C:\parts\p2\*
        if-no-files-found: warn
        retention-days: 3
        compression-level: 0
    - name: Upload tree part 3
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.finished != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: win-arm64-tree-s16-attempt-${{ github.run_attempt }}-part3
        path: C:\parts\p3\*
        if-no-files-found: warn
        retention-days: 3
        compression-level: 0
    - name: Upload tree part 4
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.finished != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: win-arm64-tree-s16-attempt-${{ github.run_attempt }}-part4
        path: C:\parts\p4\*
        if-no-files-found: warn
        retention-days: 3
        compression-level: 0
    - name: Upload fingerprint diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: fingerprint-win-arm64-${{ github.job }}-attempt-${{ github.run_attempt }}
        path: C:\c\chromix\fingerprint-diagnostics\
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload final bundle
      if: steps.stage.outputs.finished == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: win-arm64
        path: |
          C:\c\dist\chromix-win-arm64.zip
          C:\c\dist\SHA256SUMS
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    - name: Upload final source receipt
      if: steps.stage.outputs.finished == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: chromix-win-arm64-source-receipt
        path: C:\c\dist\source-verification.json
        if-no-files-found: error
        retention-days: 7
  complete:
    name: ensure build finished
    needs: [build-13, build-14, build-15, build-16]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
    - name: Assert a migrated stage finished
      env:
        FINISHED: ${{ needs.build-13.outputs.finished == 'true' || needs.build-14.outputs.finished == 'true' || needs.build-15.outputs.finished == 'true' || needs.build-16.outputs.finished == 'true' }}
      run: |
        if [ "$FINISHED" = "true" ]; then
          echo 'Migrated ARM64 build finished; bundle and source receipt uploaded.'
        else
          echo 'Build did not finish within stages 13-16; retain the last safe checkpoint.'
          exit 1
        fi
  verify-arm64:
    name: native Windows ARM64 bundle and fingerprint verification
    needs: complete
    if: ${{ !cancelled() && needs.complete.result == 'success' }}
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        architecture: x64
    - name: Download this run's compiled ARM64 bundle
      uses: actions/download-artifact@v4
      with:
        name: win-arm64
        path: dist
    - name: Download this run's source receipt
      uses: actions/download-artifact@v4
      with:
        name: chromix-win-arm64-source-receipt
        path: source-receipt
    - name: Verify checksum, PE architecture, version and native headless exit
      shell: pwsh
      timeout-minutes: 5
      run: |
        python tools/verify_windows_bundle.py --archive dist/chromix-win-arm64.zip --sha256-file dist/SHA256SUMS --dest smoke --arch arm64 --native --report diagnostics/native-smoke.json
        if ($LASTEXITCODE -ne 0) { throw 'native ARM64 bundle verification failed' }
    - name: Install fingerprint verification dependencies
      shell: pwsh
      timeout-minutes: 10
      run: |
        python -m pip install --disable-pip-version-check --timeout 30 --retries 1 -r tools/fingerprint-requirements.txt
        if ($LASTEXITCODE -ne 0) { throw 'fingerprint dependency installation failed' }
    - name: Verify native ARM64 fingerprint behavior
      shell: pwsh
      timeout-minutes: 40
      run: |
        $browser = (Resolve-Path smoke/chromix/chrome.exe).Path
        $hash = (Get-FileHash -LiteralPath $browser -Algorithm SHA256).Hash.ToLowerInvariant()
        $pins = & build/windows/read-platform-pins.ps1 -Repo (Get-Location).Path
        $version = $pins.ChromiumVersion
        python -X utf8 tools/fingerprint_acceptance.py --browser $browser --expected-sha256 $hash --expected-version $version --source-report source-receipt/source-verification.json --output-dir diagnostics/fingerprint
        if ($LASTEXITCODE -ne 0) { throw 'native ARM64 fingerprint acceptance failed' }
    - name: Upload native verification diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: native-win-arm64-attempt-${{ github.run_attempt }}
        path: diagnostics/
        if-no-files-found: warn
        retention-days: 7
'on':
  workflow_dispatch: {}
